[package]
name = "vetpharma"
version = "0.1.0"
description = "Application desktop de gestion de pharmacie vétérinaire"
authors = ["VetPharma"]
edition = "2021"

# ⚠️ Le nom ci-dessous doit être appelé depuis main.rs : `vetpharma_lib::run()`
[lib]
name = "vetpharma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- Tauri v2 (cœur) ---
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ➕ SQLite embarquée (compilée avec l'app, zéro dépendance système)
rusqlite = { version = "0.32", features = ["bundled"] }

# ➕ Authentification (hachage de mot de passe)
bcrypt = "0.15"

# ➕ Identifiants uniques
uuid = { version = "1", features = ["v4", "serde"] }

# ➕ Dates / timestamps
chrono = { version = "0.4", features = ["serde"] }

# ➕ Erreurs idiomatiques
thiserror = "1"
tauri-plugin-dialog = "2.8.4"
